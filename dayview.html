<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK Parliament — Order of Business</title>
  <link rel="stylesheet" href="./common.css">
  <style>
    .dashboard-grid {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      gap: 0.9rem;
      width: 100%;
      padding: 0.5rem 1.1rem 1rem 1.1rem;
    }

    .region {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-radius: 0.6rem;
      padding: 0.8rem 1rem;
      border: 1px solid var(--region-border);
    }

    .region-commons {
      --region-border: var(--commons-border);
      background-color: var(--commons-bg);
      color: #00543c;
    }

    .region-lords {
      --region-border: var(--lords-border);
      background-color: var(--lords-bg);
      color: #8c0b2e;
    }

    .region-other {
      --region-border: var(--border-muted);
      background-color: var(--bg-muted);
      color: var(--text-secondary);
    }

    .region-title {
      flex: 0 0 auto;
      margin: 0 0 0.6rem 0;
      padding-bottom: 0.45rem;
      font-size: 1.2rem;
      font-weight: 700;
      border-bottom: 1px solid var(--region-border);
    }

    .region-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }

    .location-section + .location-section {
      margin-top: 0.9rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--region-border);
    }

    .location-title {
      margin: 0 0 0.45rem 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .event-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .event-row {
      display: grid;
      grid-template-columns: 3.3rem 1fr;
      align-items: baseline;
      column-gap: 0.6rem;
    }

    .region-other .event-row {
      grid-template-columns: 6.4rem 1fr;
    }

    .event-time {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .event-content {
      min-width: 0;
    }

    .chip-debate {
      background-color: #bfdbfe;
      color: #1e3a8a;
    }

    .chip-questions {
      background-color: #fef08a;
      color: #713f12;
    }

    .chip-urgent {
      background-color: #fecaca;
      color: #7f1d1d;
    }

    .chip-statement {
      background-color: #e9d5ff;
      color: #581c87;
    }

    .chip-legislation {
      background-color: #bbf7d0;
      color: #14532d;
    }

    .chip-motion {
      background-color: #fed7aa;
      color: #7c2d12;
    }

    .chip-procedural {
      background-color: var(--border-light);
      color: var(--text-secondary);
    }

    .event-subject {
      color: var(--text-strong);
    }

    .event-collapsed {
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>

<body>
  <header class="page-header">
    <h1 id="page-title" class="page-title">UK Parliament — Order of Business</h1>
  </header>

  <div class="dashboard-grid">
    <section class="region region-commons">
      <h2 class="region-title">Commons</h2>
      <div id="commons" class="region-body">
        <p class="region-status">Loading...</p>
      </div>
    </section>

    <section class="region region-lords">
      <h2 class="region-title">Lords</h2>
      <div id="lords" class="region-body">
        <p class="region-status">Loading...</p>
      </div>
    </section>

    <section class="region region-other">
      <h2 class="region-title">Other Locations</h2>
      <div id="other" class="region-body">
        <p class="region-status">Loading...</p>
      </div>
    </section>
  </div>

  <script type="module">
    import {
      collator,
      isoDateFormatter,
      headerDateFormatter,
      parseDate,
      createPartyChip,
      createHouseChip,
      createStatusElement,
    } from './common.js';

    const pageTitleEl = document.getElementById('page-title');
    const HOUSE_REGIONS = [
      {
        house: 'Commons',
        el: document.getElementById('commons'),
        types: ['Main Chamber', 'Westminster Hall'],
      },
      {
        house: 'Lords',
        el: document.getElementById('lords'),
        types: ['Main Chamber', 'Grand Committee'],
      },
    ];
    const otherRegionEl = document.getElementById('other');

    const PMB_CATEGORY = "Private Members' Bills";
    const PMQ_CATEGORY = "Prime Minister's Question Time";
    const EXCLUDED_CATEGORIES = new Set([
      'Oral evidence',
      'Oral evidence, Private discussion',
      'Private Meeting',
    ]);
    const CATEGORY_CHIPS = {
      'Debate': 'chip-debate',
      'Backbench Business': 'chip-debate',
      'Oral questions': 'chip-questions',
      'PMQs': 'chip-questions',
      'Urgent question': 'chip-urgent',
      'Urgent Question Repeat': 'chip-urgent',
      'Private Notice Question': 'chip-urgent',
      'Statement': 'chip-statement',
      'Legislation': 'chip-legislation',
      [PMB_CATEGORY]: 'chip-legislation',
      'Orders and regulations': 'chip-legislation',
      'Ten Minute Rule Motion': 'chip-legislation',
      'Motion': 'chip-motion',
      'Adjournment': 'chip-procedural',
      'Estimated rising time': 'chip-procedural',
      'Introduction(s)': 'chip-procedural',
      'Royal Assent': 'chip-procedural',
    };
    const MAX_CONSECUTIVE_PMBS = 6;
    const MAX_SUBJECT_LENGTH = 150;

    function getSelectedDate() {
      return new URLSearchParams(window.location.search).get('date')?.trim()
        || isoDateFormatter.format(new Date());
    }

    function getLocation(event) {
      return event.Location?.trim().replace(/\s+/g, ' ') || 'Unknown';
    }

    function toTitleCase(str) {
      return str.toLowerCase().replace(/(?:^|[\s\d,-])\p{L}/gu, m => m.toUpperCase());
    }

    function splitLocation(loc) {
      const commaIndex = loc.indexOf(',');
      return commaIndex === -1
        ? { building: '', room: loc.trim() }
        : {
          room: loc.slice(0, commaIndex).trim(),
          building: loc.slice(commaIndex + 1).trim(),
        };
    }

    function compareLocations(locA, locB) {
      const a = splitLocation(locA);
      const b = splitLocation(locB);
      return collator.compare(a.building, b.building) || collator.compare(a.room, b.room);
    }

    function compareEvents(a, b) {
      if (a.SortOrder !== b.SortOrder) {
        return a.SortOrder - b.SortOrder;
      }
      const timeA = a.StartTime || '99:99';
      const timeB = b.StartTime || '99:99';
      return timeA.localeCompare(timeB) || (a.Id - b.Id);
    }

    function rewriteCategory(category) {
      if (category === PMQ_CATEGORY) return 'PMQs';
      if (/ debate$/i.test(category)) return 'Debate';
      if (/ statement$/i.test(category)) return 'Statement';
      if (/^motion /i.test(category)) return 'Motion';
      return category;
    }

    function getEventSubject(event) {
      let text = event.Category === PMQ_CATEGORY && event.Members?.[0]?.Name
        ? `To ${event.Members[0].Name}`
        : (event.Description || '');
      if (!text && event.Committee) {
        const subject = event.Committee.Description || '';
        const inquiries = (event.Committee.Inquiries || [])
          .map(i => i.Description)
          .filter(Boolean)
          .join(', ');
        text = inquiries ? `${subject}: ${inquiries}` : subject;
      }
      return text.length > MAX_SUBJECT_LENGTH
        ? `${text.slice(0, MAX_SUBJECT_LENGTH).trimEnd()}…`
        : text;
    }

    function setAllRegionsStatus(text, isError = false) {
      for (const el of [...HOUSE_REGIONS.map(r => r.el), otherRegionEl]) {
        el.replaceChildren(createStatusElement(text, isError));
      }
    }

    function createEventRow(event, isOtherLocation) {
      const li = document.createElement('li');
      li.className = 'event-row';

      const startTime = event.StartTime?.trim() || '';
      const endTime = isOtherLocation ? (event.EndTime?.trim() || '') : '';
      const timeSpan = document.createElement('span');
      timeSpan.className = 'event-time';
      timeSpan.textContent = startTime && endTime ? `${startTime}–${endTime}` : startTime;

      const contentSpan = document.createElement('div');
      contentSpan.className = 'event-content';

      if (isOtherLocation) {
        contentSpan.appendChild(createHouseChip(event.House, event.LeadHouse));
      }

      const category = rewriteCategory(event.Category?.trim() || '');
      if (category) {
        const chip = document.createElement('span');
        chip.className = `chip ${CATEGORY_CHIPS[category] || 'chip-unknown'}`;
        chip.textContent = category;
        contentSpan.appendChild(chip);
      }

      const partyEntries = (event.Members || []).map(m => ({
        party: m?.Party,
        partyColour: m?.PartyColour,
      }));
      const partyChip = createPartyChip(partyEntries);
      if (partyChip) {
        contentSpan.appendChild(partyChip);
      }

      const subject = getEventSubject(event);
      if (subject) {
        const subjectSpan = document.createElement('span');
        subjectSpan.className = 'event-subject';
        subjectSpan.textContent = subject;
        contentSpan.appendChild(subjectSpan);
      }

      li.append(timeSpan, contentSpan);
      return li;
    }

    function createCollapsedPmbRow(extraCount) {
      const li = document.createElement('li');
      li.className = 'event-row';

      const timeSpan = document.createElement('span');
      timeSpan.className = 'event-time';

      const contentSpan = document.createElement('div');
      contentSpan.className = 'event-content';

      const chip = document.createElement('span');
      chip.className = `chip ${CATEGORY_CHIPS[PMB_CATEGORY]}`;
      chip.textContent = PMB_CATEGORY;

      const subjectSpan = document.createElement('span');
      subjectSpan.className = 'event-collapsed';
      subjectSpan.textContent = `...and ${extraCount} more`;

      contentSpan.append(chip, subjectSpan);
      li.append(timeSpan, contentSpan);
      return li;
    }

    function createEventListElement(events, isOtherLocation = false) {
      if (!events.length) {
        return createStatusElement('No scheduled business');
      }

      const sorted = events.toSorted(compareEvents);
      const ul = document.createElement('ul');
      ul.className = 'event-list';

      let pmbRun = 0;
      for (const event of sorted) {
        if (event.Category === PMB_CATEGORY) {
          pmbRun++;
          if (pmbRun <= MAX_CONSECUTIVE_PMBS) {
            ul.appendChild(createEventRow(event, isOtherLocation));
          }
        } else {
          if (pmbRun > MAX_CONSECUTIVE_PMBS) {
            ul.appendChild(createCollapsedPmbRow(pmbRun - MAX_CONSECUTIVE_PMBS));
          }
          pmbRun = 0;
          ul.appendChild(createEventRow(event, isOtherLocation));
        }
      }
      if (pmbRun > MAX_CONSECUTIVE_PMBS) {
        ul.appendChild(createCollapsedPmbRow(pmbRun - MAX_CONSECUTIVE_PMBS));
      }

      return ul;
    }

    function createLocationSection(titleText, events, isOtherLocation = false) {
      const section = document.createElement('section');
      section.className = 'location-section';

      const title = document.createElement('h3');
      title.className = 'location-title';
      title.textContent = titleText;

      section.append(title, createEventListElement(events, isOtherLocation));
      return section;
    }

    async function loadEvents(dateStr) {
      const dateObj = parseDate(dateStr);
      if (!dateObj) {
        setAllRegionsStatus(`Invalid date: ${dateStr}`, true);
        return;
      }

      pageTitleEl.textContent = `UK Parliament — Order of Business for ${headerDateFormatter.format(dateObj)}`;
      document.title = `UK Parliament — Order of Business (${dateStr})`;

      setAllRegionsStatus('Loading...');

      const url = `https://whatson-api.parliament.uk/calendar/events/list.json?queryParameters.startDate=${encodeURIComponent(dateStr)}&queryParameters.endDate=${encodeURIComponent(dateStr)}`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const events = await response.json();
        renderEvents(Array.isArray(events) ? events : []);
      } catch (err) {
        setAllRegionsStatus(`Error loading events: ${err.message}`, true);
      }
    }

    function renderEvents(events) {
      const houseBuckets = new Map(
        HOUSE_REGIONS.flatMap(({ house, types }) => types.map(type => [`${house}:${type}`, []]))
      );
      const otherByLocation = new Map();

      for (const event of events) {
        if (event.CancelledDate || EXCLUDED_CATEGORIES.has(event.Category)) continue;

        const houseBucket = houseBuckets.get(`${event.House}:${event.Type}`);
        if (houseBucket) {
          houseBucket.push(event);
        } else {
          const loc = getLocation(event);
          const locKey = loc.toLowerCase();
          let group = otherByLocation.get(locKey);
          if (!group) {
            group = { title: loc, events: [] };
            otherByLocation.set(locKey, group);
          } else if (group.title !== loc) {
            group.title = toTitleCase(loc);
          }
          group.events.push(event);
        }
      }

      for (const { house, el, types } of HOUSE_REGIONS) {
        el.replaceChildren(
          ...types.map(type => createLocationSection(type, houseBuckets.get(`${house}:${type}`)))
        );
      }

      if (otherByLocation.size === 0) {
        otherRegionEl.replaceChildren(createStatusElement('No scheduled business'));
        return;
      }

      const sortedGroups = Array.from(otherByLocation.values())
        .toSorted((a, b) => compareLocations(a.title, b.title));
      otherRegionEl.replaceChildren(
        ...sortedGroups.map(group => createLocationSection(group.title, group.events, true))
      );
    }

    loadEvents(getSelectedDate());
  </script>
</body>

</html>
